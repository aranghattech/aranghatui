# VitePress builds with cleanUrls, so /guide/theming has no extension on disk: try the path, then
# the .html file, then a directory index. A miss is a real 404 — `=404` keeps the status honest
# and `error_page` renders VitePress's own 404 page as the body.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed filenames never change. One Cache-Control, set here rather than by `expires`, which
  # would emit a second, conflicting header.
  location /assets/ {
    add_header Cache-Control "public, immutable, max-age=31536000";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html $uri/index.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
